[project]
name = "uzex-intent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.163.1,<1", "uvicorn", "pydantic>=2,<3", "duckdb>=2,<3", "pandas>=2.2,<3", "numpy<2", "networkx>=3,<4", "httpx", "python-dotenv", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

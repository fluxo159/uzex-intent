
limit_req_zone  $binary_remote_addr zone=api_ip:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status  429;
limit_conn_status 429;

log_format intent_noargs '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                         '$request_time "$http_user_agent"';

upstream intent_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

server {
    listen 80;
    listen [::]:80;
    server_name demo.example www.demo.example;

    root /var/www/intent;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/intent.access.log intent_noargs;
    error_log  /var/log/nginx/intent.error.log warn;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_static on;

    location /api/ {
        limit_req  zone=api_ip burst=80 nodelay;
        limit_conn conn_ip 40;

        proxy_pass http://intent_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/intake/stt {
        limit_req  zone=api_ip burst=20 nodelay;
        limit_conn conn_ip 40;
        client_max_body_size 2m;
        proxy_pass http://intent_api/intake/stt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

    location @api_down {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":{"code":"restarting","message_ru":"Сервис перезапускается, повторите через несколько секунд.","message_uz":"Xizmat qayta ishga tushmoqda, birozdan so‘ng qayta urinib ko‘ring."}}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
